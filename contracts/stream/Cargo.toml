[package]
name = "tricklepay-stream"
description = "Token streaming contract for TricklePay on Soroban"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = ["soroban", "stellar", "streaming", "payments"]

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"

[workspace.package]
version = "0.1.0" # (or your current workspace version)
rust-version = "1.82.0" # Replace with the exact version specified in rust-toolchain.toml
edition = "2021"
